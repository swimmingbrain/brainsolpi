[project]
name = "brainsolpi"
version = "0.1.0"
description = "The brain of the brainSOL dual axis solar tracker, control loop, simulation and web server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Braian PLAKU" }]
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "astral>=3.2",
  "pyserial>=3.5",
]

[project.scripts]
brainsolpi = "brainsolpi.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brainsolpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
